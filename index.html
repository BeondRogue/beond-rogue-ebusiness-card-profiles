<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beond Rogue — E-Business Cards</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .index-card {
            width: 95%;
            max-width: 480px;
            margin: 30px auto;
            background: linear-gradient(to bottom, rgba(46,17,84,0.97), rgba(17,5,36,0.97));
            border: 1px solid rgba(0,168,150,0.4);
            border-radius: 20px;
            padding: 30px 25px;
            text-align: center;
            color: #F4F4F9;
        }
        .index-card h1 {
            font-family: 'Anton', sans-serif;
            font-style: italic;
            font-size: 1.8rem;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #FFDF00, #D4AF37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
            margin-bottom: 10px;
        }
        .index-card p { color: rgba(244,244,249,0.7); font-size: 0.9rem; }
    </style>
</head>
<body>
    <img src="assets/images/banner.png" alt="Beond Rogue Banner" class="banner-img">
    <div class="index-card">
        <img src="assets/images/logo.jpg" alt="Beond Rogue Logo" class="profile-logo" style="width:80px;height:80px;border-radius:50%;border:3px solid #2E1154;box-shadow:0 0 12px #00A896;object-fit:cover;margin-bottom:15px;">
        <h1>Beond Rogue</h1>
        <p>Digital E-Business Cards</p>
    </div>
    <div class="footer">Not affiliated with Nintendo, Pokémon Company, Creatures, GAME FREAK, Wizards of the Coast, or Konami.</div>
    <script src="assets/js/main.js"></script>
</body>
</html>
